name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Project uses objectVersion 77 (Xcode 16+). macos-14 ships Xcode 15.4,
    # which cannot open this pbxproj format.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Floor is Swift 6.2 — SE-0371 nonisolated deinit, load-bearing since 8d4f0ae; 16.4 ships Swift 6.1.
          xcode-version: '26.3'

      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.sh

      - name: Build and test
        run: |
          xcodebuild \
            -project WaxOnWaxOff.xcodeproj \
            -scheme WaxOnWaxOff \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            test
